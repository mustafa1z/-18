name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -o HandControlAndroid.zip
      - name: Fix build script
        working-directory: HandControlAndroid/app
        run: |
          sed -i '1i import java.net.URI' build.gradle.kts
          sed -i 's/java\.net\.URL(url)/URI(url).toURL()/' build.gradle.kts
      - name: Build debug APK
        working-directory: HandControlAndroid
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HandControl-APK
          path: HandControlAndroid/app/build/outputs/apk/debug/app-debug.apk
